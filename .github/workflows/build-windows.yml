name: Build Windows Executable

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r windows-app/requirements.txt pyinstaller

      - name: Download FFmpeg & Cloudflared binaries
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://gyan.dev" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_temp" -Force
          $ffmpegExe = Get-ChildItem -Path "ffmpeg_temp" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          Copy-Item $ffmpegExe.FullName -Destination "windows-app/ffmpeg.exe"

          Invoke-WebRequest -Uri "https://github.com" -OutFile "windows-app/cloudflared.exe"

      - name: Build single-file Windows EXE
        run: |
          pyinstaller --noconsole --onefile --name "MusicPromoRepurposer-Windows" --add-binary "windows-app/ffmpeg.exe;." --add-binary "windows-app/cloudflared.exe;." windows-app/app.py

      - name: Publish Release with EXE
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Windows App v1.0.${{ github.run_number }}
          files: dist/MusicPromoRepurposer-Windows.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
