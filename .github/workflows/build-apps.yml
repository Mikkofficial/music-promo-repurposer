name: Build Desktop Apps (Windows & macOS)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Desktop-app/requirements.txt pyinstaller

      - name: Download Cloudflared binary
        shell: pwsh
        run: |
          curl.exe -sSL "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -o "Desktop-app/cloudflared.exe"

      - name: Build Windows EXE
        run: |
          pyinstaller --noconsole --onefile --name "MusicPromoRepurposer-Windows" --collect-all imageio_ffmpeg --add-binary "Desktop-app/cloudflared.exe;." Desktop-app/app.py

      - name: Upload Windows EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/MusicPromoRepurposer-Windows.exe

  build-macos:
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install -r Desktop-app/requirements.txt pyinstaller

      - name: Download Cloudflared binary for macOS
        run: |
          curl -sSL "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-arm64.tgz" -o cloudflared.tgz
          tar -xzf cloudflared.tgz -C Desktop-app/
          chmod +x Desktop-app/cloudflared

      - name: Build macOS App & DMG
        run: |
          pyinstaller --windowed --name "MusicPromoRepurposer" --collect-all imageio_ffmpeg --add-binary "Desktop-app/cloudflared:." Desktop-app/app.py
          mkdir -p dmg_staging
          cp -R "dist/MusicPromoRepurposer.app" dmg_staging/
          ln -s /Applications dmg_staging/Applications
          hdiutil create -volname "Music Promo Repurposer" -srcfolder dmg_staging -ov -format UDZO "dist/MusicPromoRepurposer-macOS.dmg"

      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/MusicPromoRepurposer-macOS.dmg

  publish-release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Desktop App v1.0.${{ github.run_number }}
          files: |
            release-files/MusicPromoRepurposer-Windows.exe
            release-files/MusicPromoRepurposer-macOS.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
