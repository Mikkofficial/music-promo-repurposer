name: Build Desktop Apps (Windows & macOS)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.1.0)'
        required: true
        default: 'v1.1.0'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Desktop-app/requirements.txt pyinstaller

      - name: Download Cloudflared binary
        shell: pwsh
        run: |
          curl.exe -sSL "https://github.com" -o "Desktop-app/cloudflared.exe"

      - name: Build single-file Windows EXE
        run: |
          pyinstaller --noconsole --onefile --name "MusicPromoRepurposer-Windows" --collect-all imageio_ffmpeg --add-binary "Desktop-app/cloudflared.exe;." Desktop-app/app.py

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: dist/MusicPromoRepurposer-Windows.exe

  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies & Cloudflared
        run: |
          python3 -m pip install --upgrade pip
          pip3 install -r Desktop-app/requirements.txt pyinstaller
          brew install cloudflared create-dmg
          cp $(which cloudflared) Desktop-app/cloudflared

      - name: Build macOS App & DMG
        run: |
          pyinstaller --noconsole --windowed --name "Music Promo Repurposer" --collect-all imageio_ffmpeg --add-binary "Desktop-app/cloudflared:." Desktop-app/app.py
          mkdir -p dmg_stage
          cp -R "dist/Music Promo Repurposer.app" dmg_stage/
          ln -s /Applications dmg_stage/Applications
          hdiutil create -volname "Music Promo Repurposer" -srcfolder dmg_stage -ov -format UDZO dist/MusicPromoRepurposer-macOS.dmg

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: dist/MusicPromoRepurposer-macOS.dmg

  publish-release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: Music Promo Repurposer ${{ github.event.inputs.version }}
          files: |
            release-assets/MusicPromoRepurposer-Windows.exe
            release-assets/MusicPromoRepurposer-macOS.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
